<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alerts - Campus Surveillance</title>
  <style>
    body {
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { color: #ff2d2d; margin-top: 20px; }
    table {
      width: 90%;
      margin: 30px auto;
      border-collapse: collapse;
      background: #1b1b1b;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 15px;
      border-bottom: 1px solid #333;
      text-align: center;
    }
    th { background: #ff2d2d; color: white; }
    img {
      width: 150px;
      border-radius: 5px;
      border: 1px solid #444;
    }
    a {
      color: #ff2d2d;
      text-decoration: none;
      font-weight: bold;
    }
    .back { margin-top: 25px; }
  </style>
</head>
<body>
  <h1>⚠️ Recent Alerts</h1>
  <table>
    <tr>
      <th>Timestamp</th>
      <th>Event Type</th>
      <th>Description</th>
      <th>Image</th>
    </tr>
    {% for a in alerts %}
    <tr>
      <td>{{ a.timestamp }}</td>
      <td>{{ a.event_type }}</td>
      <td>{{ a.description }}</td>
      <td>
        {% if a.image %}
          <img src="/{{ a.image }}" alt="snapshot">
        {% else %}
          N/A
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </table>
  <div class="back">
    <a href="/">← Back to Dashboard</a>
  </div>
</body>
</html>
